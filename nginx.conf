worker_processes auto;

events {}

http {
    # --------------------
    # Common proxy headers
    # --------------------
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 8080;

        root /usr/share/nginx/html;
        index index.html;

        location = / {
            try_files /index.html =404;
        }

        # =========================================================
        # PORT 700 RELAYS
        # =========================================================

        location /usa001 {
            proxy_pass http://94.183.185.78:80;
        }
        
        # =========================================================
        # US001 - UNITED STATES 01
        # =========================================================

        location /vless_us001 {
            proxy_pass http://94.183.185.78/vless_;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /vmess_us001 {
            proxy_pass http://94.183.185.78/vmess_;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /trojan-ws_us001 {
            proxy_pass http://94.183.185.78/trojan-ws_;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        
    }
}
